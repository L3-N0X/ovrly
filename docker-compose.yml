services:
  db:
    image: postgres:15
    container_name: ovrly-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ovrly
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ovrly"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # Self-hosted S3-compatible object storage for uploaded images (RustFS).
  # Any other S3 service works too (MinIO, Garage, SeaweedFS, AWS S3, Cloudflare R2, ...):
  # remove the `s3` and `s3-init` services and point the S3_* variables of `app` at it.
  # The app proxies all image requests, so this service does not need to be reachable
  # from the outside.
  s3:
    image: rustfs/rustfs:latest
    container_name: ovrly-s3
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: ${OVRLY_S3_ACCESS_KEY:-ovrly}
      RUSTFS_SECRET_KEY: ${OVRLY_S3_SECRET_KEY:-change-me-please}
    volumes:
      - s3data:/data
    restart: unless-stopped

  # Creates the bucket (a plain SigV4-signed PUT, so it works against any S3 service).
  s3-init:
    image: curlimages/curl:latest
    container_name: ovrly-s3-init
    depends_on:
      - s3
    environment:
      S3_ACCESS_KEY: ${OVRLY_S3_ACCESS_KEY:-ovrly}
      S3_SECRET_KEY: ${OVRLY_S3_SECRET_KEY:-change-me-please}
      S3_BUCKET: ${OVRLY_S3_BUCKET:-ovrly}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until code=$$(curl -s -o /dev/null -w '%{http_code}' \
            --aws-sigv4 "aws:amz:us-east-1:s3" --user "$$S3_ACCESS_KEY:$$S3_SECRET_KEY" \
            -X PUT "http://s3:9000/$$S3_BUCKET"); [ "$$code" = 200 ] || [ "$$code" = 409 ]; do
          echo "waiting for s3 (last status: $$code)"; sleep 2
        done
        echo "bucket $$S3_BUCKET ready"
    restart: "no"

  app:
    container_name: ovrly-app
    build:
      context: .
      args:
        - VITE_GOOGLE_FONTS_API_KEY=${VITE_GOOGLE_FONTS_API_KEY}

    # Alternatively, use the pre-built image:
    # Uncomment the line below and comment out the build section above.
    #
    # image: ghcr.io/l3-n0x/ovrly:latest

    ports:
      # Application port, use this to access the web interface
      # Can be forwarded or proxied as needed
      - "3030:3000"
    depends_on:
      db:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    # IMPORTANT: Update these environment variables as needed
    environment:
      # Base URL where the app will be accessible
      - APP_BASE_URL=http://localhost:3000

      # Database connection URL
      - DATABASE_URL=postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/ovrly

      # A strong secret key for authentication
      - AUTH_SECRET=${OVRLY_AUTH_SECRET}

      # Twitch OAuth credentials
      - AUTH_TWITCH_ID=${OVRLY_TWITCH_CLIENT_ID}
      - AUTH_TWITCH_SECRET=${OVRLY_TWITCH_CLIENT_SECRET}

      # Spotify app credentials (optional), for the Spotify variables
      - SPOTIFY_CLIENT_ID=${OVRLY_SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${OVRLY_SPOTIFY_CLIENT_SECRET:-}

      # S3-compatible storage for uploaded images. The defaults match the bundled `s3` service.
      - S3_ENDPOINT=http://s3:9000
      - S3_BUCKET=${OVRLY_S3_BUCKET:-ovrly}
      - S3_ACCESS_KEY_ID=${OVRLY_S3_ACCESS_KEY:-ovrly}
      - S3_SECRET_ACCESS_KEY=${OVRLY_S3_SECRET_KEY:-change-me-please}
      - S3_REGION=us-east-1
    restart: unless-stopped

volumes:
  pgdata:
  s3data:
